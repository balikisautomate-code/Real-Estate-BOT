# Development Docker Compose
# Primary database for development: your local MySQL on the host.
# The mysql service below is optional — use it only if you prefer DB inside Docker.

services:
  # Optional: MySQL in Docker (skip this if you use MySQL installed on your PC)
  mysql:
    image: mysql:8.0
    container_name: real-estate-leads-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: real_estate_leads
      MYSQL_USER: realestate
      MYSQL_PASSWORD: realestate
    ports:
      - "3307:3306"   # 3307 on host to avoid clashing with your local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (optional in Docker — you can also run uvicorn on the host)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: real-estate-leads-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # When backend runs in Docker and MySQL is on the host, use host.docker.internal
      # When using the mysql service above, use: mysql+pymysql://realestate:realestate@mysql:3306/real_estate_leads
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:your_password@host.docker.internal:3306/real_estate_leads}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  n8n:
    image: n8nio/n8n:latest
    container_name: real-estate-leads-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - GENERIC_TIMEZONE=Africa/Lagos
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows

volumes:
  mysql_data:
  n8n_data:
